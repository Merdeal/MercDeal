plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.merdeal.mercdeal"
    compileSdk = flutter.compileSdkVersion

    defaultConfig {
        applicationId = "com.merdeal.mercdeal"
        minSdk = 21
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("CM_KEYSTORE_PATH")
            def keystorePassword = System.getenv("CM_KEYSTORE_PASSWORD")
            def keyAlias = System.getenv("CM_KEY_ALIAS")
            def keyPassword = System.getenv("CM_KEY_PASSWORD")

            if (keystorePath != null && keystorePassword != null && keyAlias != null && keyPassword != null) {
                storeFile = file(keystorePath)
                storePassword = keystorePassword
                keyAlias = keyAlias
                keyPassword = keyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}
