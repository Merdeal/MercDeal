workflows:
  android-debug:
    name: MercDeal Android Debug
    max_build_duration: 30
    environment:
      flutter: stable
      android_signing:
        - mercdeal_keystore
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Flutter tests
        script: flutter test
      - name: Build debug APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

  android-release:
    name: MercDeal Android Release
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Build release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

  ios-build:
    name: MercDeal iOS Build
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Build iOS
        script: flutter build ios --no-codesign
