workflows:
  android-debug:
    name: MercDeal Android Debug
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Widget tests
        script: flutter test
      - name: Generate Android platform
        script: flutter create --platforms=android --org it.mercdeal .
      - name: Build APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

  android-release:
    name: MercDeal Android Release
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Static analysis
        script: flutter analyze
      - name: Widget tests
        script: flutter test
      - name: Generate Android platform
        script: flutter create --platforms=android --org it.mercdeal .
      - name: Build release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

  ios-build:
    name: MercDeal iOS Build
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Static analysis
        script: flutter analyze
      - name: Widget tests
        script: flutter test
      - name: Generate iOS platform files
        script: flutter create --platforms=ios --org it.mercdeal .
      - name: Build iOS without signing
        script: flutter build ios --no-codesign
    artifacts:
      - build/ios/iphoneos/Runner.app
