name: MercDeal - Import V4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-v4:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check V4 ZIP
        shell: bash
        run: |
          test -f MercDeal_FINAL_COMPLETO_V4.zip
          echo "ZIP V4 trovato."

      - name: Replace project with V4
        shell: bash
        run: |
          set -e

          rm -rf /tmp/mercdeal_v4
          mkdir -p /tmp/mercdeal_v4

          unzip -q MercDeal_FINAL_COMPLETO_V4.zip -d /tmp/mercdeal_v4

          ROOT="/tmp/mercdeal_v4"

          if [ -d "$ROOT/MercDeal-main" ]; then
            ROOT="$ROOT/MercDeal-main"
          fi

          echo "Contenuto V4:"
          ls -la "$ROOT"

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "MercDeal_FINAL_COMPLETO_V4.zip" \
            -exec rm -rf {} +

          rm -f .github/workflows/fix-profile.yml
          rm -f .github/workflows/extract-mercdeal.yml

          cp -R "$ROOT"/. .

          rm -f MercDeal_FINAL_COMPLETO_V4.zip

      - name: Verify project
        shell: bash
        run: |
          set -e

          test -f pubspec.yaml
          test -f lib/main.dart
          test -d assets

          if grep -R "GlowButton" lib; then
            echo "ERRORE: GlowButton trovato nel progetto."
            exit 1
          fi

          echo "================================"
          echo "MERCDEAL V4 VERIFICATO"
          echo "================================"
          echo "pubspec.yaml OK"
          echo "lib/main.dart OK"
          echo "assets OK"
          echo "GlowButton assente"

      - name: Commit V4
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nessuna modifica da committare."
          else
            git commit -m "Import MercDeal V4 complete project"
            git push
          fi
