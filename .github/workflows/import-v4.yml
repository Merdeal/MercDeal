name: MercDeal - Import V4 Corrected

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-v4:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check corrected V4 ZIP
        shell: bash
        run: |
          set -e
          test -f MercDeal_FINAL_COMPLETO_V4_CORRETTO.zip
          echo "ZIP V4 corretto trovato."

      - name: Replace project files with corrected V4
        shell: bash
        run: |
          set -e

          rm -rf /tmp/mercdeal_v4
          mkdir -p /tmp/mercdeal_v4

          unzip -q MercDeal_FINAL_COMPLETO_V4_CORRETTO.zip -d /tmp/mercdeal_v4

          ROOT="/tmp/mercdeal_v4"

          if [ -d "$ROOT/MercDeal-main" ]; then
            ROOT="$ROOT/MercDeal-main"
          fi

          echo "Contenuto del progetto V4:"
          ls -la "$ROOT"

          # Remove the old application files, but NEVER touch .github.
          # This prevents the GitHub App from trying to create/update workflow files.
          find . -mindepth 1 -maxdepth 1             ! -name ".git"             ! -name ".github"             ! -name "MercDeal_FINAL_COMPLETO_V4_CORRETTO.zip"             -exec rm -rf {} +

          # Copy the V4 application while explicitly excluding any .github
          # directory contained inside the ZIP.
          if command -v rsync >/dev/null 2>&1; then
            rsync -a --exclude='.github' "$ROOT"/ ./
          else
            cp -R "$ROOT"/. /tmp/mercdeal_copy
            rm -rf /tmp/mercdeal_copy/.github
            cp -R /tmp/mercdeal_copy/. ./
          fi

          rm -f MercDeal_FINAL_COMPLETO_V4_CORRETTO.zip

      - name: Verify project
        shell: bash
        run: |
          set -e

          test -f pubspec.yaml
          test -f lib/main.dart
          test -d assets
          test -f lib/features/profile/profile_screen.dart

          if grep -q "GlowButton" lib/features/profile/profile_screen.dart; then
            echo "ERRORE: GlowButton trovato in profile_screen.dart"
            exit 1
          fi

          echo "================================"
          echo "MERCDEAL V4 CORRETTO VERIFICATO"
          echo "================================"
          echo "pubspec.yaml OK"
          echo "lib/main.dart OK"
          echo "assets OK"
          echo "profile_screen.dart OK"
          echo "GlowButton assente da profile_screen.dart"
          echo ".github preservato"

      - name: Commit V4
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nessuna modifica da committare."
          else
            git commit -m "Import MercDeal V4 corrected project"
            git push
          fi
