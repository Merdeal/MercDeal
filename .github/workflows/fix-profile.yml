DART

      - name: Verify file exists and syntax delimiters
        shell: bash
        run: |
          test -s lib/features/profile/profile_screen.dart
          python3 - <<'PY'
          from pathlib import Path

          s = Path("lib/features/profile/profile_screen.dart").read_text()
          pairs = {')': '(', ']': '[', '}': '{'}
          stack = []

          for ch in s:
              if ch in "([{":
                  stack.append(ch)
              elif ch in ")]}":
                  if not stack or stack[-1] != pairs[ch]:
                      raise SystemExit("Unbalanced Dart delimiters")
                  stack.pop()

          if stack:
              raise SystemExit("Unclosed Dart delimiters")

          print("profile_screen.dart OK")
          PY

      - name: Commit fixed file
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/profile/profile_screen.dart
          git commit -m "Fix profile screen syntax" || echo "No changes to commit"
          git push
