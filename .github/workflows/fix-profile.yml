name: MercDeal - Fix Profile Screen

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write fixed profile_screen.dart
        shell: bash
        run: |
          mkdir -p lib/features/profile

          cat > lib/features/profile/profile_screen.dart <<'DART'
