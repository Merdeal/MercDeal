name: MercDeal - Fix Profile Screen

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace profile_screen.dart
        shell: bash
        run: |
          mkdir -p lib/features/profile
          echo '' | base64 -d > lib/features/profile/profile_screen.dart
          test -s lib/features/profile/profile_screen.dart
          grep -q "OutlinedButton.icon" lib/features/profile/profile_screen.dart
          if grep -q "GlowButton" lib/features/profile/profile_screen.dart; then
            echo "ERROR: GlowButton still present"
            exit 1
          fi

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/profile/profile_screen.dart
          git diff --cached --quiet || git commit -m "Fix profile screen button"
          git push
