name: Prepare MercDeal

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix Dart syntax errors
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          # listing_detail_screen.dart
          p = Path("lib/features/listing/listing_detail_screen.dart")
          s = p.read_text(encoding="utf-8")

          # Fix the extra ')' at the end of _auction().
          s = s.replace("])])));", "])]));")

          # Fix the missing ')' closing showModalBottomSheet() in _offer().
          s = s.replace(
              "Navigator.pop(c))]));}",
              "Navigator.pop(c))])));}"
          )

          p.write_text(s, encoding="utf-8")

          # checkout_screen.dart
          p = Path("lib/features/checkout/checkout_screen.dart")
          s = p.read_text(encoding="utf-8")

          # Fix the missing ')' closing _choice().
          s = s.replace(
              "Colors.white24)]));",
              "Colors.white24)])));"
          )

          # Fix the extra ')' at the end of build().
          s = s.replace(
              "const MeetupScreen()))) ])));}",
              "const MeetupScreen()))) ]));}"
          )

          p.write_text(s, encoding="utf-8")

          print("Dart syntax fixes applied.")

          # Basic delimiter sanity check on the two modified files.
          for name in [
              "lib/features/listing/listing_detail_screen.dart",
              "lib/features/checkout/checkout_screen.dart",
          ]:
              text = Path(name).read_text(encoding="utf-8")
              print(
                  name,
                  "():", text.count("(") - text.count(")"),
                  "{}:", text.count("{") - text.count("}"),
                  "[]:", text.count("[") - text.count("]"),
              )
          PY

      - name: Verify required files
        shell: bash
        run: |
          set -e
          test -f pubspec.yaml
          test -f lib/features/listing/listing_detail_screen.dart
          test -f lib/features/checkout/checkout_screen.dart
          test -f test/widget_test.dart
          echo "MercDeal files OK"

      - name: Commit fixes
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add lib/features/listing/listing_detail_screen.dart \
                  lib/features/checkout/checkout_screen.dart

          if git diff --cached --quiet; then
            echo "Nessuna modifica: i fix sono già presenti."
            exit 0
          fi

          git commit -m "Fix MercDeal Dart syntax"
          git push
