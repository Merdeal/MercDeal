name: MercDeal - Fix Profile

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace profile_screen.dart
        shell: bash
        run: |
          mkdir -p lib/features/profile
          echo '' | base64 -d > lib/features/profile/profile_screen.dart

      - name: Check file
        shell: bash
        run: |
          test -s lib/features/profile/profile_screen.dart
          echo "profile_screen.dart scritto correttamente"

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/profile/profile_screen.dart
          git diff --cached --quiet || git commit -m "Fix profile screen syntax"
          git push
